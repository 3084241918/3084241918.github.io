name: Sync CSDN blog articles

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00（北京时间 09:00）自动运行
  workflow_dispatch:      # 也可以在 Actions 页面手动点 "Run workflow" 立即同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch CSDN RSS and rebuild works.json
        run: python sync_works.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.json
          git diff --staged --quiet || git commit -m "chore: sync CSDN articles"
          git push
